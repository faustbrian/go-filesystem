schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzParsePath$'
        budget: 10s
        timeout: 20m
      - type: go-test
        packages: [./local]
        fuzz: '^FuzzSymlinkContainment$'
        budget: 10s
        timeout: 20m
      - type: go-test
        packages: [./memory]
        fuzz: '^FuzzMetadataAndListings$'
        budget: 10s
        timeout: 20m
      - type: go-test
        packages: [./s3]
        fuzz: '^FuzzLogicalKeyTranslation$'
        budget: 10s
        timeout: 20m
      - type: go-test
        packages: [./ftp]
        fuzz: '^FuzzMalformedListingEntry$'
        budget: 10s
        timeout: 20m
      - type: go-test
        packages: [./sftp]
        fuzz: '^FuzzMalformedListingInfo$'
        budget: 10s
        timeout: 20m
      - type: go-test
        packages: [./internal/redact]
        fuzz: '^FuzzErrorRedaction$'
        budget: 10s
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./local, ./memory]
        benchmark: '^Benchmark(LargeObjectStreaming|Streaming|Listing)$'
        budget: 1x
        timeout: 20m

schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2.txt
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [./local]
        run: '^TestConcurrentCreateOnlyWritesPublishExactlyOnce$'
        race: true
        count: 1
        timeout: 2m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzParsePath$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./local]
        fuzz: '^FuzzSymlinkContainment$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./memory]
        fuzz: '^FuzzMetadataAndListings$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./s3]
        fuzz: '^FuzzLogicalKeyTranslation$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./ftp]
        fuzz: '^FuzzMalformedListingEntry$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./sftp]
        fuzz: '^FuzzMalformedListingInfo$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./internal/redact]
        fuzz: '^FuzzErrorRedaction$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./local, ./memory]
        benchmark: '^Benchmark(LargeObjectStreaming|Streaming|Listing)$'
        budget: 1x
        timeout: 20m
